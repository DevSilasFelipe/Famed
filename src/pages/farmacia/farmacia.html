<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Famed | Farmácias</title>
  <link rel="stylesheet" href="../../css/farmacia/farmacia.css">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

</head>

<body>

  <header class="navbar">
        <div class="logo">
            <img src="../../img/logo2.png" alt="Logo Famed">
        </div><!--logo-->

        <nav class="menu">
            <a href="#">Receitas Dispensadas</a>
        </nav><!--menu-->

        <div class="nav-actions">
            <div class="perfil-area">
                <button class="perfil" id="btnPerfil">
                    <img src="../../img/perfil.png" alt="Perfil">
                </button>

                <div class="menu-perfil" id="menuPerfil">
                    <button onclick="logout()">
                        Sair
                    </button>
                </div><!--menuPerfil-->
            </div><!--perfil-area-->
        </div><!--nav-actions-->
    </header><!--navbar-->

  <!-- =========================
       CONTEÚDO
  ========================== -->
  <main class="container">

    <div class="token-box">

      <input
        type="text"
        class="token-input"
        placeholder="Digite o token da receita"
      >

      <button class="arrow-button">
        →
      </button>

    </div>

  </main>

  <!-- =========================
       FOOTER
  ========================== -->
  <footer class="footer">
        <img src="../../img/logobranca.png" alt="Logo Famed Branca">

        <div class="footer-links">
            <a href="#">Ajuda</a>
            <a href="#">Termos de Uso</a>
            <a href="#">Política de Privacidade</a>
        </div><!--footer-links-->
    </footer>

  <script src="../../js/login/protecao.js"></script>
  <script src="../../js/login/menuPerfil.js"></script>

  <script>
    verificarLogin("farmacia");
    iniciarMenuPerfil();
  </script>
</body>
</html>
