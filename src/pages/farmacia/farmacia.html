<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Famed | Farmácias</title>
  <link rel="stylesheet" href="../../css/farmacia/farmacia.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <header class="header">

    <div class="logo-area">

      <img
        src="../../img/logoprincipal2.png"
        alt="Logo Famed"
        class="header-logo"
      >

      <h1 class="logo-title">
        Farmácia
      </h1>

    </div>

    <!-- Usuário -->
    <div class="user-icon">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="42"
        height="42"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 6.75a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zm4.5 13.5a8.25 8.25 0 10-16.5 0h16.5z"
        />
      </svg>

    </div>

  </header>

  <!-- =========================
       CONTEÚDO
  ========================== -->
  <main class="container">

    <div class="token-box">

      <input
        type="text"
        class="token-input"
        placeholder="Digite o token da receita"
      >

      <button class="arrow-button">
        →
      </button>

    </div>

  </main>

  <!-- =========================
       FOOTER
  ========================== -->
  <footer>

    <!-- Logo -->
    <img
      src="../../img/logoprincipal2.png"
      alt="Logo Famed"
      class="footer-logo"
    >

    <!-- Links -->
    <div class="footer-links">

      <a href="#">
        FAQ
      </a>

      <a href="#">
        Termos de Uso
      </a>

      <a href="#">
        Política de Privacidade
      </a>

    </div>

  </footer>

  <script src="../../js/login/protecao.js"></script>

  <script>
    verificarLogin("farmacia");
  </script>
</body>
</html>
