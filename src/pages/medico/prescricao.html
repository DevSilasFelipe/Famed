<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/medico/prescricao.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">


    <title>Famed | Criar Prescrição</title>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img src="../../img/logo2.png" alt="Logo Famed">
        </div><!--logo-->

        <nav class="menu">
            <a href="inicio.html">Home</a>
            <a href="#">Meus Pacientes</a>
            <a href="historico.html">Minhas Receitas</a>
        </nav><!--menu-->

        <div class="nav-actions">
            <a href="#" class="btn-criar">
                CRIAR
            </a>
            
            <div class="perfil-area">
                <button class="perfil" id="btnPerfil">
                    <img src="../../img/perfil.png" alt="Perfil">
                </button>

                <div class="menu-perfil" id="menuPerfil">
                    <button onclick="logout()">
                        Sair
                    </button>
                </div><!--menuPerfil-->
            </div><!--perfil-area-->
        </div><!--nav-actions-->
    </header><!--navbar-->

    <main class="main">
        <h1 class="titulo">Nova Prescrição</h1>

        <section>
            <div class="card">
                <!--formularios que nao sao formularios-->
                <div class="campo">
                    <label for="NomeCliente">Paciente</label><br>
                    <input type="text" id="NomeCliente" name="NomeCliente" placeholder="Nome Completo"><br>
                </div>
                <div class="campo">
                    <label for="CPF">CPF</label>
                    <input type="text" id="CPF" name="CPF" placeholder="000.000.000-00" maxlength="11"><br>
                    <div class="linha">
                        <div class=" display tipoReceita">
                            <label for="TipoReceita">Tipo da Receita</label><br>
                            <select id="TipoReceita" name="TipoReceita" required>
                                <option selected disabled>Selecionar</option>
                                <option>Comum</option>
                                <option>Antimicrobianos</option>
                                <option>Controle Especial (C1)</option>
                            </select>
                        </div>
                        <div class="display medicamento">
                            <label for="Medicamento">Medicamento</label><br>
                            <input type="search" id="Medicamento" name="Medicamento" placeholder="Buscar"><br>
                        </div>
                        <div class="display quantidade">
                            <label for="Quantidade">Quantidade</label><br>
                            <input type="text" id="Quantidade" name="Quantidade"><br><br>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="Posologia">Posologia</label>
                        <input type="text" id="Posologia" name="Posologia">
                    </div>
                    <input type="submit" value="Gerar prescrição" class="botao">

                    </form>
                </div>
        </section>

    </main>


    <footer class="footer">
        <img src="../../img/logobranca.png" alt="Logo Famed Branca">

        <div class="footer-links">
            <a href="#">Ajuda</a>
            <a href="#">Termos de Uso</a>
            <a href="#">Política de Privacidade</a>
        </div><!--footer-links-->
    </footer>

    <script src="../../js/login/protecao.js"></script>
    <script src="../../js/login/menuPerfil.js"></script>

    <script>
        verificarLogin("medico");
        iniciarMenuPerfil();
    </script>
</body>

</html>
