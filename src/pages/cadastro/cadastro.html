<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/cadastro/cadastro.css">

    <title>Cadastro | Famed</title>
</head>

<body>
    <main class="container">
        <section class="cadastro-box">
            <img src="../../img/logoprincipalmenor.png" alt="logo famed" class="logo">

            <!--TIPO DE CONTA-->
            <div class="tipo-conta">
                <p>Selecione o tipo de conta</p>

                <div class="tipo-botoes">
                    <button type="button" class="tipo-btn" data-form="paciente">
                        Paciente
                    </button><!--tipo-btn-->

                    <button type="button" class="tipo-btn" data-form="medico">
                        Médico
                    </button><!--tipo-btn-->

                    <button type="button" class="tipo-btn" data-form="farmacia">
                        Farmácia
                    </button><!--tipo-btn-->
                </div><!--tipo-botoes-->
            </div><!--tipo-conta-->

            <form>
                <!--FORMULÁRIO DO PACIENTE-->
                <div class="formulario paciente-form hidden" id="paciente">
                    <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text">
                    </div><!--input-group-->

                    <div class="linha">
                        <div class="input-group">
                            <label>CPF</label>
                            <input type="text">
                        </div><!--input-group-->

                        <div class="input-group pequeno">
                            <label>Idade</label>
                            <input type="text">
                        </div><!--input-group-->

                        <div class="input-group pequeno">
                            <label>Gênero</label>
                            <input type="text">
                        </div><!--input-group-->
                    </div><!--linha-->
                    
                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email">
                    </div><!--input-group-->

                    <div class="input-group">
                        <label>Endereço Completo</label>
                        <input type="text">
                    </div><!--input-group-->
                </div><!--formulario paciente-form-->

                <!--FORMULÁRIO MÉDICO-->
                <div class="formulario medico-form hidden" id="medico">
                    <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text">
                    </div><!--input-group-->

                    <div class="linha">
                        <div class="input-group">
                            <label>CRM</label>
                            <input type="text">
                        </div><!--input-group-->

                        <div class="input-group pequeno">
                            <label>UF CRM</label>
                            <input type="text">
                        </div><!--input-group pequeno-->
                    </div><!--linha-->

                    <div class="input-group">
                        <label>CPF</label>
                        <input type="text">
                    </div><!--input-group-->

                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email">
                    </div><!--input-group-->

                    <div class="input-group">
                        <label>Endereço de Atendimento</label>
                        <input type="text">
                    </div><!--input-group-->
                </div><!--formulario medico-form hidden-->

                <!--FORMULÁRIO FARMÁCIA-->
                <div class="formulario farmacia-form hidden" id="farmacia">
                    <div class="input-group">
                        <label>Nome da Farmácia</label>
                        <input type="text">
                    </div><!--input-group-->

                    <div class="input-group">
                        <label>CNPJ</label>
                        <input type="text">
                    </div><!--input-group-->

                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email">
                    </div><!--input-group-->

                    <div class="input-group">
                        <label>Endereço Comercial</label>
                        <input type="text">
                    </div><!--input-group-->
                </div><!--formulario farmacia-form hidden-->

                <div class="acoes hidden" id="acoes">
                    <button type="submit" class="continuar-btn">
                        Continuar
                    </button><!--acoes-->
                </div>
            </form>

            <p class="login-link">
                Já tem conta?
                <a href="../login/login.html">Entrar</a>
            </p>
        </section><!--cadastro-box-->
    </main><!--container-->

    <script src="../../js/cadastro/cadastro.js"></script>
</body>

</html>
